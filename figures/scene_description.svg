<svg viewBox="0 0 1280 508" xmlns="http://www.w3.org/2000/svg" role="img" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif">
<title>Scene description pipeline</title>
<desc>Gesture-controlled scene assistant: double-tap captures a photo and asks Claude to describe hazards, single-tap asks a spoken follow-up about the same photo, and hold (or saying stop) stops. Flow: capture, on-device quality gate, Claude vision-language model, spoken aloud while streaming, then listen for a follow-up that loops back to Claude. Voice in and out run on-device; only Claude calls are billed.</desc>

<rect x="8" y="8" width="1264" height="492" rx="18" fill="#ffffff" stroke="#e9eef5"/>
<text x="40" y="42" font-size="25" font-weight="700" fill="#0f172a">Scene description: ask Claude what&#39;s around you</text>
<text x="40" y="64" font-size="14" fill="#64748b">captures a photo, speaks the hazards aloud, then answers your spoken follow-ups &#8212; hands-free</text>

<!-- gesture controls -->
<rect x="334" y="90" width="210" height="26" rx="13" fill="#fde7ef" stroke="#f6b3cd"/>
<circle cx="352" cy="103" r="3.5" fill="#cc1557"/><circle cx="362" cy="103" r="3.5" fill="#cc1557"/>
<text x="374" y="107" font-size="13" font-weight="600" fill="#be185d">double-tap &#8594; describe</text>
<rect x="562" y="90" width="170" height="26" rx="13" fill="#fde7ef" stroke="#f6b3cd"/>
<circle cx="580" cy="103" r="3.5" fill="#cc1557"/>
<text x="592" y="107" font-size="13" font-weight="600" fill="#be185d">single-tap &#8594; ask</text>
<rect x="750" y="90" width="196" height="26" rx="13" fill="#fde7ef" stroke="#f6b3cd"/>
<circle cx="768" cy="103" r="5" fill="none" stroke="#cc1557" stroke-width="2"/><circle cx="768" cy="103" r="1.8" fill="#cc1557"/>
<text x="782" y="107" font-size="13" font-weight="600" fill="#be185d">hold / &#39;stop&#39; &#8594; stop</text>

<!-- P1 CAPTURE -->
<rect x="40" y="150" width="214" height="252" rx="14" fill="#fff" stroke="#e2e8f0"/>
<path d="M40,164 Q40,150 54,150 L240,150 Q254,150 254,164 L254,188 L40,188 Z" fill="#4338ca"/>
<circle cx="62" cy="169" r="10" fill="#fff"/><text x="62" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">1</text>
<text x="80" y="174" font-size="13" font-weight="600" fill="#fff" letter-spacing="0.4">CAPTURE</text>
<rect x="113" y="240" width="68" height="56" rx="6" fill="#eef2ff" stroke="#4338ca" stroke-width="2.5"/>
<circle cx="133" cy="262" r="6" fill="#4338ca"/>
<path d="M121,294 L141,267 L157,294 Z" fill="#4338ca"/>
<path d="M147,294 L163,272 L179,294 Z" fill="#4338ca" opacity="0.8"/>
<text x="147" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Capture</text>
<text x="147" y="394" text-anchor="middle" font-size="11" fill="#64748b">anchor photo (JPEG)</text>

<!-- P2 QUALITY GATE -->
<rect x="286" y="150" width="214" height="252" rx="14" fill="#fff" stroke="#e2e8f0"/>
<path d="M286,164 Q286,150 300,150 L486,150 Q500,150 500,164 L500,188 L286,188 Z" fill="#4338ca"/>
<circle cx="308" cy="169" r="10" fill="#fff"/><text x="308" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">2</text>
<text x="326" y="174" font-size="11" font-weight="600" fill="#fff" letter-spacing="0.4">QUALITY GATE</text>
<circle cx="393" cy="268" r="26" fill="#eef2ff" stroke="#4338ca" stroke-width="3"/>
<path d="M381,268 l8,9 l16,-18" fill="none" stroke="#4338ca" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="393" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Quality gate</text>
<text x="393" y="394" text-anchor="middle" font-size="11" fill="#64748b">dark? blurry? &#8594; retry</text>

<!-- P3 CLAUDE -->
<rect x="532" y="150" width="232" height="252" rx="14" fill="#fff" stroke="#e2e8f0"/>
<path d="M532,164 Q532,150 546,150 L750,150 Q764,150 764,164 L764,188 L532,188 Z" fill="#4338ca"/>
<circle cx="554" cy="169" r="10" fill="#fff"/><text x="554" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">3</text>
<text x="572" y="174" font-size="13" font-weight="600" fill="#fff" letter-spacing="0.4">CLAUDE</text>
<path d="M648,242 C652,262 654,264 674,268 C654,272 652,274 648,294 C644,274 642,272 622,268 C642,264 644,262 648,242 Z" fill="#4338ca"/>
<path d="M681,246 l2,6 l6,2 l-6,2 l-2,6 l-2,-6 l-6,-2 l6,-2 z" fill="#4338ca" opacity="0.75"/>
<text x="648" y="378" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Claude &#183; Sonnet 4.6</text>
<text x="648" y="394" text-anchor="middle" font-size="11" fill="#64748b">sees photo &#183; hazards first</text>

<!-- P4 SPEAK -->
<rect x="796" y="150" width="196" height="252" rx="14" fill="#fff" stroke="#e2e8f0"/>
<path d="M796,164 Q796,150 810,150 L978,150 Q992,150 992,164 L992,188 L796,188 Z" fill="#4338ca"/>
<circle cx="818" cy="169" r="10" fill="#fff"/><text x="818" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">4</text>
<text x="836" y="174" font-size="13" font-weight="600" fill="#fff" letter-spacing="0.4">SPEAK</text>
<path d="M878,260 h9 l13,-10 v36 l-13,-10 h-9 z" fill="#4338ca"/>
<path d="M906,256 q9,12 0,24" fill="none" stroke="#4338ca" stroke-width="2"/>
<path d="M913,250 q14,16 0,36" fill="none" stroke="#4338ca" stroke-width="2"/>
<text x="894" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Speak aloud</text>
<text x="894" y="394" text-anchor="middle" font-size="11" fill="#64748b">sentence-by-sentence</text>

<!-- P5 LISTEN -->
<rect x="1024" y="150" width="216" height="252" rx="14" fill="#fff" stroke="#e2e8f0"/>
<path d="M1024,164 Q1024,150 1038,150 L1226,150 Q1240,150 1240,164 L1240,188 L1024,188 Z" fill="#4338ca"/>
<circle cx="1046" cy="169" r="10" fill="#fff"/><text x="1046" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#4338ca">5</text>
<text x="1064" y="174" font-size="13" font-weight="600" fill="#fff" letter-spacing="0.4">LISTEN</text>
<rect x="1124" y="244" width="16" height="30" rx="8" fill="#4338ca"/>
<path d="M1116,266 a16,16 0 0 0 32,0" fill="none" stroke="#4338ca" stroke-width="2.5"/>
<line x1="1132" y1="282" x2="1132" y2="294" stroke="#4338ca" stroke-width="2.5"/>
<line x1="1123" y1="294" x2="1141" y2="294" stroke="#4338ca" stroke-width="2.5"/>
<text x="1132" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#0f172a">Listen</text>
<text x="1132" y="394" text-anchor="middle" font-size="11" fill="#64748b">your follow-up</text>

<!-- arrows -->
<path d="M265,267 l11,9 l-11,9" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M511,267 l11,9 l-11,9" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M775,267 l11,9 l-11,9" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M1003,267 l11,9 l-11,9" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<!-- conversation loop: Listen -> Claude -->
<path d="M1132,402 L1132,430 Q1132,436 1126,436 L654,436 Q648,436 648,430 L648,408" fill="none" stroke="#4338ca" stroke-width="2.5"/>
<path d="M643,414 L648,404 L653,414" fill="none" stroke="#4338ca" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="786" y="425" width="208" height="16" fill="#ffffff"/>
<text x="890" y="437" text-anchor="middle" font-size="12" font-weight="600" fill="#4338ca">follow-up &#183; same photo</text>

<!-- footer -->
<rect x="40" y="462" width="176" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/><circle cx="58" cy="475" r="4" fill="#22c55e"/><text x="70" y="479" font-size="12" fill="#334155">voice on-device (free)</text>
<rect x="226" y="462" width="150" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/><circle cx="244" cy="475" r="4" fill="#22c55e"/><text x="256" y="479" font-size="12" fill="#334155">only Claude billed</text>
<rect x="386" y="462" width="180" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/><circle cx="404" cy="475" r="4" fill="#22c55e"/><text x="416" y="479" font-size="12" fill="#334155">speaks while streaming</text>
<rect x="576" y="462" width="248" height="26" rx="13" fill="#f1f5f9" stroke="#e2e8f0"/><circle cx="594" cy="475" r="4" fill="#22c55e"/><text x="606" y="479" font-size="12" fill="#334155">photo cached &#8594; cheap follow-ups</text>
<text x="1240" y="479" text-anchor="end" font-size="12" fill="#64748b">runs in the browser &#183; pairs with the echolocation engine</text>
</svg>
